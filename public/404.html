<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page introuvable | Lynxa Tech Guinée</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- Page statique servie pour les 404 (fichiers absents sous /assets/) :
         Vercel l'utilise automatiquement, public/_redirects y renvoie sur
         Netlify. Aucune dépendance au bundle de l'application. -->
    <style>
      :root { --primary: #FF8C00; --primary-strong: #A65400; --secondary: #0A0A0A; --muted: #6B7280; --border: #E5E7EB; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
             font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--secondary); background: #fff; }
      main { max-width: 520px; text-align: center; }
      .code { font-size: 64px; font-weight: 800; color: var(--primary); margin: 0 0 8px; letter-spacing: -1px; }
      h1 { font-size: 24px; margin: 0 0 12px; }
      p { color: var(--muted); line-height: 1.6; margin: 0 0 28px; }
      .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      a { display: inline-block; padding: 12px 22px; border-radius: 12px; font-weight: 600; text-decoration: none; }
      .primary { background: var(--primary); color: var(--secondary); }
      .secondary { border: 1px solid var(--border); color: var(--secondary); }
      a:focus-visible { outline: 3px solid var(--primary-strong); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Page ou fichier introuvable</h1>
      <p>L'adresse demandée n'existe pas ou a été déplacée.</p>
      <div class="actions">
        <a class="primary" href="/">Retour à l'accueil</a>
        <a class="secondary" href="/contact">Nous contacter</a>
      </div>
    </main>
  </body>
</html>
